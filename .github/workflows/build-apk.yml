name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle fonts into the app
        run: python3 tools/localize_fonts.py app/src/main/assets/www

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk notbook.apk

      - uses: actions/upload-artifact@v4
        with:
          name: notbook-apk
          path: notbook.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 笔记与打字机 v1.0.${{ github.run_number }}
          body: |
            测试版安装包（debug 签名，可直接安装）。
            下载 notbook.apk，在手机上打开安装；如提示，允许"安装未知应用"。
          files: notbook.apk
          make_latest: true
