plugins {
    id 'com.android.application'
}

android {
    namespace 'com.notbook.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.notbook.app'
        minSdk 24
        targetSdk 34
        def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
        versionCode run
        versionName "1.0.${run}"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
