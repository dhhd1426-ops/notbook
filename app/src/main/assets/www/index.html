<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}[hidden]{display:none!important}</style></head><body>
<title>笔记与打字机</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: the two original pages fill the screen; the two tabs float over their bottom edge with no bar behind them.
   The active tab is a small colour block, the idle one plain text tinted to read on the page underneath. */
:root{
  --bar:#0a0d0c;              /* replaced at runtime with the visible page's own ground colour */
  --idle:rgba(255,255,255,.55);
  --halo:rgba(0,0,0,.35);       /* soft glow behind idle text so it reads over busy content */
  --notes:#2aa955;            /* 笔记 green */
  --type:#c66a4a;             /* 打字机 clay */
  --on:#ffffff;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bar);font-family:var(--sans)}
.app{position:relative;height:100%}
.views{position:absolute;inset:0}
.views iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:transparent}
.views iframe:not(.on){visibility:hidden;pointer-events:none}
nav{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;background:transparent;pointer-events:none;
  padding-top:5px;padding-bottom:calc(5px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav button{flex:1;height:38px;pointer-events:auto;border:0;padding:0;background:transparent;display:grid;place-items:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
nav button span{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border-radius:999px;
  color:var(--idle);font:500 13px var(--sans);text-shadow:0 0 6px var(--halo);letter-spacing:.04em;transition:background .25s,color .25s,transform .12s}
nav button:active span{transform:scale(.94)}
nav button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"] span{color:var(--on);font-weight:700;text-shadow:none}
#tabNotes[aria-selected="true"] span{background:var(--notes)}
#tabType[aria-selected="true"] span{background:var(--type)}
nav button:focus-visible{outline:none}
nav button:focus-visible span{box-shadow:0 0 0 2px var(--idle)}
@media (prefers-reduced-motion:reduce){nav button span{transition:none}}
</style>

<div class="app">
  <div class="views">
    <iframe id="vNotes" class="on" src="notes.html" title="笔记"></iframe>
    <iframe id="vType" src="typewriter.html" title="打字机"></iframe>
  </div>
  <nav role="tablist" aria-label="切换页面">
    <button id="tabNotes" role="tab" aria-selected="true" aria-controls="vNotes"><span>
      <svg viewBox="0 0 24 24"><path d="M5 4.5h10.5a3 3 0 0 1 3 3V19.5H8a3 3 0 0 1-3-3z"/><path d="M5 16.5a3 3 0 0 1 3-3h10.5"/><path d="M9 8h6"/></svg>
      笔记</span>
    </button>
    <button id="tabType" role="tab" aria-selected="false" aria-controls="vType"><span>
      <svg viewBox="0 0 24 24"><path d="M7 9V4h10v5"/><rect x="3" y="9" width="18" height="11" rx="3"/><path d="M7 13h.01M10.3 13h.01M13.7 13h.01M17 13h.01M8 16.5h8"/></svg>
      打字机</span>
    </button>
  </nav>
</div>

<script>
(function(){
  var root=document.documentElement;
  var tabs={notes:[tabNotes,vNotes],typewriter:[tabType,vType]};
  var current='notes';

  // the bar wears the ground colour of the page above it, and picks light or dark idle text to suit
  function lum(c){var m=c.match(/[\d.]+/g);if(!m||m.length<3)return 0;
    return (0.2126*m[0]+0.7152*m[1]+0.0722*m[2])/255;}
  function paint(){
    var bg='';
    try{
      var d=tabs[current][1].contentDocument, r=d&&d.documentElement;
      if(r){
        if(current==='notes'){ bg=getComputedStyle(r).getPropertyValue('--pg2').trim(); }
        else { bg=r.classList.contains('night')?'#2b2420':getComputedStyle(r).getPropertyValue('--wall-deep').trim(); }
      }
    }catch(e){}
    if(!bg) bg=current==='notes'?'#0a0d0c':'#b3a892';
    root.style.setProperty('--bar',bg);
    var probe=document.createElement('i');probe.style.color=bg;document.body.appendChild(probe);
    var light=lum(getComputedStyle(probe).color)>.5;probe.remove();
    if(current==='typewriter'){ light=false; }   // on the typewriter the tabs sit over the clay body, so ivory text reads best
    root.style.setProperty('--idle',light?'rgba(20,24,22,.6)':current==='typewriter'?'rgba(255,246,232,.9)':'rgba(255,255,255,.65)');
    root.style.setProperty('--halo',light?'rgba(255,255,255,.8)':current==='typewriter'?'rgba(70,28,12,.55)':'rgba(0,0,0,.45)');
  }
  // repaint when a page switches theme or the typewriter drifts into dusk
  function watch(frame){
    frame.addEventListener('load',function(){
      try{ new MutationObserver(paint).observe(frame.contentDocument.documentElement,{attributes:true,attributeFilter:['class','data-theme']}); }catch(e){}
      try{ frame.contentWindow.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paint); }catch(e){}
      paint();
    });
  }
  watch(vNotes); watch(vType);

  function show(name){
    if(!tabs[name]) name='notes';
    current=name;
    for(var k in tabs){var on=k===name;tabs[k][0].setAttribute('aria-selected',on);tabs[k][1].classList.toggle('on',on)}
    paint();
    try{tabs[name][1].contentWindow.focus()}catch(e){}
  }
  tabNotes.onclick=function(){show('notes')};
  tabType.onclick=function(){show('typewriter')};
  // the app always opens on 笔记
  show('notes');
})();
</script>
</body></html>
