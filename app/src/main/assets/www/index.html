<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}[hidden]{display:none!important}</style></head><body>
<title>笔记与打字机</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: two original pages stacked full-bleed; a frosted bottom bar switches between them with solid colour blocks, no lines or frames. */
:root{
  --bg:#f4f6f5;
  --bar:rgba(255,255,255,.72);
  --idle:rgba(18,23,20,.55);
  --notes:#2aa955;      /* 笔记 green */
  --type:#c66a4a;       /* 打字机 clay */
  --on:#ffffff;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d100f;--bar:rgba(28,32,30,.72);--idle:rgba(255,255,255,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d100f;--bar:rgba(28,32,30,.72);--idle:rgba(255,255,255,.6);color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);font-family:var(--sans)}
.app{height:100%;display:flex;flex-direction:column}
.views{position:relative;flex:1;min-height:0}
.views iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
.views iframe:not(.on){visibility:hidden;pointer-events:none}
nav{flex:none;display:flex;gap:10px;background:var(--bar);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav button{flex:1;height:52px;border:0;border-radius:18px;background:transparent;color:var(--idle);
  display:flex;align-items:center;justify-content:center;gap:8px;font:500 15px var(--sans);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .25s,color .25s,transform .12s}
nav button:active{transform:scale(.96)}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--on);font-weight:700}
#tabNotes[aria-selected="true"]{background:var(--notes)}
#tabType[aria-selected="true"]{background:var(--type)}
nav button:focus-visible{outline:2px solid var(--idle);outline-offset:2px}
@media (prefers-reduced-motion:reduce){nav button{transition:none}}
</style>

<div class="app">
  <div class="views">
    <iframe id="vNotes" class="on" src="notes.html" title="笔记"></iframe>
    <iframe id="vType" src="typewriter.html" title="打字机" loading="eager"></iframe>
  </div>
  <nav role="tablist" aria-label="切换页面">
    <button id="tabNotes" role="tab" aria-selected="true" aria-controls="vNotes">
      <svg viewBox="0 0 24 24"><path d="M5 4.5h10.5a3 3 0 0 1 3 3V19.5H8a3 3 0 0 1-3-3z"/><path d="M5 16.5a3 3 0 0 1 3-3h10.5"/><path d="M9 8h6"/></svg>
      笔记
    </button>
    <button id="tabType" role="tab" aria-selected="false" aria-controls="vType">
      <svg viewBox="0 0 24 24"><path d="M7 9V4h10v5"/><rect x="3" y="9" width="18" height="11" rx="3"/><path d="M7 13h.01M10.3 13h.01M13.7 13h.01M17 13h.01M8 16.5h8"/></svg>
      打字机
    </button>
  </nav>
</div>

<script>
(function(){
  var tabs={notes:[tabNotes,vNotes],typewriter:[tabType,vType]};
  function show(name){
    if(!tabs[name]) name='notes';
    for(var k in tabs){var on=k===name;tabs[k][0].setAttribute('aria-selected',on);tabs[k][1].classList.toggle('on',on)}
    try{tabs[name][1].contentWindow.focus()}catch(e){}
    try{localStorage.setItem('tab',name)}catch(e){}
  }
  tabNotes.onclick=function(){location.hash='notes'};
  tabType.onclick=function(){location.hash='typewriter'};
  addEventListener('hashchange',function(){show(location.hash.slice(1))});
  var start=location.hash.slice(1);
  if(!tabs[start]){try{start=localStorage.getItem('tab')}catch(e){}}
  show(start||'notes');
})();
</script>

</body></html>
