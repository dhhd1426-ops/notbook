/* ---------- stage ---------- */
.stage{--rail:48%;position:relative;height:max(calc(330px * var(--s,1)),62vh);border-radius:28px;background:transparent;touch-action:pan-y;cursor:grab;
  user-select:none;-webkit-user-select:none;outline:none;overflow:visible}

.track{position:absolute;left:0;top:0;zoom:var(--s,1);perspective:760px;perspective-origin:50% -40%}

  background:radial-gradient(50% 50% at 50% 50%,var(--floor),transparent 70%);pointer-events:none}
/* glass book: a 140×196 slab (A5-ish proportion), 9px thick, every face drawn so it reads as a solid block of frosted glass */
.folder{--gside-on:linear-gradient(90deg,var(--s1),var(--sm) 55%,var(--s2));--D:9px;position:absolute;width:140px;height:196px;left:-70px;top:-98px;transform-style:preserve-3d;transform-origin:50% 100%;cursor:pointer}

.s-l,.s-r{top:4px;width:var(--D);height:188px;background:var(--gside)}
.s-l{left:calc(var(--D) / -2);transform:rotateY(-90deg)}
.s-r{left:calc(140px - var(--D) / 2);transform:rotateY(90deg);background:var(--gpages)}
.s-t,.s-b{left:4px;width:132px;height:var(--D)}
.s-t{top:calc(var(--D) / -2);transform:rotateX(90deg);background:var(--gtop)}

  visibility:hidden;transition:transform .55s cubic-bezier(.2,.8,.2,1),clip-path .55s cubic-bezier(.2,.8,.2,1),visibility 0s .55s;
  background:
    linear-gradient(#26302b,#26302b) 12px 14px/52px 6px no-repeat,
    linear-gradient(color-mix(in srgb,var(--a) 30%,transparent),color-mix(in srgb,var(--a) 30%,transparent)) 12px 27px/64px 8px no-repeat,
    repeating-linear-gradient(#cfd6d1 0 2px,transparent 2px 11px) 12px 48px/96px 110px no-repeat,
    #fbfbf8}
/* front cover: frosted, so what's inside shows only as soft blurred shapes */
.front{width:140px;height:196px;transform-origin:0 50%;transform:translateZ(calc(var(--D) / 2));transition:transform .7s cubic-bezier(.2,.8,.2,1);

    radial-gradient(70px 8px at 50px 42px,var(--ghost-accent),transparent 70%),

  padding:0 max(22px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}

/* colour-scheme picker */
.navbtn.palbtn i{width:18px;height:18px;border-radius:50%;background:var(--pal-chip,var(--a));box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}

      eMeta=document.getElementById('eMeta'), eConfirm=document.getElementById('eConfirm'), rWrite=document.getElementById('rWrite');
let edK=-1, edFrom=null, edAnim=false, edStart={t:'',b:''};
const chars=t=>t.replace(/\s/g,'').length;
const edDirty=()=>eTitle.value!==edStart.t||eBody.value!==edStart.b;
function edMeta(){ eMeta.textContent=`${DATA[readerBook].n} · ${chars(eBody.value)} 字`; }
function openEditor(k,fromEl){
  if(edAnim||!editor.hidden) return;
  const d=DATA[readerBook], n=k>=0?d.notes[k]:null;
  edK=k; edFrom=fromEl; edStart={t:n?n.t:'',b:n?n.b:''}; eTitle.value=edStart.t; eBody.value=edStart.b; eConfirm.hidden=true; edMeta();
  editor.hidden=false; epanel.style.transition='none';
  if(!reduce&&fromEl){ epanel.style.transform=flipTo(epanel,fromEl); epanel.style.borderRadius=k>=0?'16px':'999px'; }
  fromEl&&fromEl.classList.add('hold');
  void epanel.offsetWidth;
  epanel.style.transition='transform .5s cubic-bezier(.2,.85,.25,1),border-radius .5s';
  epanel.style.transform=''; epanel.style.borderRadius='';
  editor.classList.add('in'); eBody.scrollTop=0;
  setTimeout(()=>{ (k<0?eTitle:eBack).focus({preventScroll:true}); }, reduce?0:380);
}
function closeEditor(toEl){
  if(edAnim) return; edAnim=true; eConfirm.hidden=true;
  editor.classList.remove('in');
  const target=toEl&&toEl.isConnected?toEl:rWrite;
  target.classList.remove('hold'); const t=reduce?'':flipTo(epanel,target); target.classList.add('hold');
  epanel.style.transition='transform .42s cubic-bezier(.4,0,.2,1),border-radius .42s';
  epanel.style.transform=t; epanel.style.borderRadius=target===rWrite?'999px':'16px';
  setTimeout(()=>{ editor.hidden=true; epanel.style.transition='none'; epanel.style.transform=''; epanel.style.borderRadius='';
    document.querySelectorAll('.rnote.hold,.rbtn.hold').forEach(x=>x.classList.remove('hold'));
    edAnim=false; edFrom=null; (target.isConnected?target:rWrite).focus({preventScroll:true}); }, reduce?0:420);
}
function saveEditor(){
  let t=eTitle.value.trim(); const b=eBody.value.replace(/\s+$/,'');
  if(!t&&!b.trim()){ closeEditor(edFrom); return; }
  if(!t){ eTitle.classList.remove('need'); void eTitle.offsetWidth; eTitle.classList.add('need'); eTitle.placeholder='先写一个标题'; eTitle.focus(); return; }
  const i=readerBook, d=DATA[i]; let k=edK;
  if(k>=0){ const n=d.notes[k]; d.w+=chars(b)-chars(n.b||''); n.t=t; n.b=b; n.m=n.pin?'置顶 · 刚刚编辑':'刚刚编辑'; }
  else { d.notes.unshift({t,b,m:'刚刚'}); d.c++; d.w+=chars(b); k=0; }
  d.t='刚刚'; d.touched=true; saveNotes();
  fillReader(i); paint(i);
  const a=active; active=-1; setActive(a);
  const card=rBody.querySelector(`.rnote[data-k="${k}"]`); card&&card.scrollIntoView({block:'nearest'});
  closeEditor(card);
  const tt=document.createElement('div'); tt.className='toast'; tt.textContent=edK>=0?'已保存':'已保存到「'+d.n+'」'; document.body.appendChild(tt); setTimeout(()=>tt.remove(),2000);
}
function backEditor(){ if(edDirty()){ eConfirm.hidden=false; document.getElementById('eKeep').focus(); } else closeEditor(edFrom); }
const eBack=document.getElementById('eBack');
eBack.onclick=backEditor;
document.getElementById('eSave').onclick=saveEditor;
document.getElementById('eDiscard').onclick=()=>closeEditor(edFrom);
document.getElementById('eKeep').onclick=()=>{ eConfirm.hidden=true; eBody.focus(); };
eBody.addEventListener('input',edMeta);
eTitle.addEventListener('input',()=>{ eTitle.placeholder='标题'; });
eTitle.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); eBody.focus(); } });
editor.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ e.preventDefault(); eConfirm.hidden?backEditor():(eConfirm.hidden=true); }
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){ e.preventDefault(); saveEditor(); }
  e.stopPropagation(); });
rWrite.onclick=()=>openEditor(-1,rWrite);
rBody.addEventListener('click',e=>{ const c=e.target.closest('.rnote'); if(c) openEditor(+c.dataset.k,c); });
rBody.addEventListener('keydown',e=>{ const c=e.target.closest('.rnote'); if(c&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); openEditor(+c.dataset.k,c); } });

// ---------- theme toggle ----------
const mq=matchMedia('(prefers-color-scheme: dark)');
const MOON='M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z', SUN='M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM11 1h2v3h-2zM11 20h2v3h-2zM1 11h3v2H1zM20 11h3v2h-3zM4.2 2.8l2.1 2.1-1.4 1.4-2.1-2.1zM19.1 17.7l2.1 2.1-1.4 1.4-2.1-2.1zM2.8 19.8l2.1-2.1 1.4 1.4-2.1 2.1zM17.7 4.9l2.1-2.1 1.4 1.4-2.1 2.1z';
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':mq.matches;
function syncIcon(){ const d=isDark(); document.getElementById('themeIco').setAttribute('d',d?SUN:MOON); document.getElementById('themeBtn').setAttribute('aria-label',d?'切换浅色模式':'切换深色模式'); }
try{ const t=localStorage.getItem('notes-theme'); if(t==='dark'||t==='light') root.dataset.theme=t; }catch(e){}
document.getElementById('themeBtn').onclick=()=>{ const t=isDark()?'light':'dark'; root.dataset.theme=t; try{localStorage.setItem('notes-theme',t)}catch(e){} syncIcon(); };
mq.addEventListener?.('change',syncIcon); new MutationObserver(syncIcon).observe(root,{attributes:true,attributeFilter:['data-theme']}); syncIcon();

</script>
