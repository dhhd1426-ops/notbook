<style>
/* Layout: one full-bleed scene. A clay-and-ivory portable typewriter sits at the bottom; the carriage slides, the sheet rises, the T striker taps at centre. */
:root{
  --wall:#cfc6b4;
  --wall-deep:#b3a892;
  --clay:#c66a4a;        /* body */
  --ivory:#f2ece0;       /* keycaps, badge */
  --char:#2b2724;        /* legends, ink */
  --chip:rgba(247,241,229,.74);
  --chip-line:rgba(60,48,36,.16);
  --chip-ink:#3a3129;
  --ui:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --label:"Barlow Condensed","Arial Narrow",sans-serif;
  --sans-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --sheet:#f6f1e7; --field:rgba(60,48,36,.07); --clay:#c66a4a;
  color-scheme:light;
}
:root.night{--chip:rgba(30,26,32,.62);--chip-line:rgba(255,214,160,.16);--chip-ink:#ecdcc4;--sheet:#221d22;--field:rgba(255,230,200,.08)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--wall);color:var(--chip-ink)}
#stage{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(120% 90% at 62% 18%,#ded6c6 0%,var(--wall) 46%,var(--wall-deep) 100%);
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
#paper,#fx{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#twB{position:absolute;z-index:1;overflow:visible;pointer-events:none}
#paper{z-index:2}
#twF{position:absolute;z-index:3;overflow:visible;pointer-events:none}
#twF .k,#twF #lever,#twF #space{pointer-events:all;cursor:pointer}
#twF .k:focus-visible .cap > :first-child{stroke:#e9a23b;stroke-width:3}
#sun{position:absolute;inset:0;z-index:4;pointer-events:none;mix-blend-mode:soft-light}
#sun .panes{position:absolute;right:-18%;top:-8%;width:92%;height:92%;display:grid;grid-template-columns:1fr 1fr;gap:5%;
  transform:rotate(-9deg) skewX(-12deg);filter:blur(16px);opacity:.75}
#sun .panes i{background:linear-gradient(160deg,rgba(255,244,214,1),rgba(255,226,170,.75))}
#sun svg{position:absolute;right:-6%;top:-4%;width:80%;height:auto;mix-blend-mode:multiply;opacity:.35;filter:blur(7px);
  transform-origin:90% 0%;animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.5deg) translateX(-6px)}to{transform:rotate(2deg) translateX(8px)}}
#fx{z-index:5;pointer-events:none}
.flyer{position:absolute;z-index:4;pointer-events:none;filter:drop-shadow(0 10px 18px rgba(40,28,16,.28));will-change:transform}
#ui{position:absolute;z-index:6;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.status{font:500 11px/1.5 var(--ui);letter-spacing:.08em;color:var(--chip-ink);opacity:.78;min-width:0}
.status b{font-weight:500;display:block;letter-spacing:.18em}
.status span{display:block;opacity:.75;transition:opacity .6s}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:all}
.tools button{width:36px;height:36px;border-radius:50%;border:1px solid var(--chip-line);background:var(--chip);color:var(--chip-ink);
  display:grid;place-items:center;padding:0;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  font:500 12px var(--ui);transition:background .4s,color .4s,transform .15s}
.tools button:active{transform:scale(.92)}
.tools button:focus-visible{outline:2px solid #c47a1c;outline-offset:2px}
.tools svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tools button[aria-pressed="false"] .on,.tools button[aria-pressed="true"] .off{display:none}
#reader{position:absolute;inset:0;z-index:8;background:rgba(36,28,22,.55);-webkit-backdrop-filter:blur(14px) saturate(120%);backdrop-filter:blur(14px) saturate(120%);
  opacity:0;transition:opacity .32s ease}
#reader.on{opacity:1}
:root.night #reader{background:rgba(10,8,10,.72)}
#reader .rscroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding-top:calc(env(safe-area-inset-top,0px) + 28px);padding-bottom:64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#rpage{display:block;margin:0 auto;border-radius:3px;box-shadow:0 2px 4px rgba(40,28,16,.18),0 22px 50px rgba(30,20,10,.35);
  transform:translateY(24px) scale(.94);transform-origin:50% 0;transition:transform .42s cubic-bezier(.2,.8,.2,1)}
#reader.on #rpage{transform:none}
#reader .rhint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;
  font:500 11px/1 var(--ui);letter-spacing:.14em;color:rgba(255,246,232,.75);pointer-events:none}
/* overflow menu (⋯): the less-used tools fold away here, in the same frosted chip as the round buttons */
.tools{flex-wrap:nowrap;flex:none}   /* four round buttons always sit on one row */
.more{position:relative}
.menu{position:absolute;right:0;top:44px;min-width:184px;padding:6px;border-radius:18px;background:var(--chip);border:1px solid var(--chip-line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 14px 34px rgba(40,28,16,.18);
  display:flex;flex-direction:column;gap:2px;transform-origin:100% 0;animation:menuIn .18s cubic-bezier(.2,.8,.2,1)}
@keyframes menuIn{from{opacity:0;transform:scale(.92) translateY(-4px)}to{opacity:1;transform:none}}
.tools .menu button{width:100%;height:42px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:flex-start;
  gap:12px;padding:0 12px;font:500 14px var(--sans-ui);letter-spacing:.02em;text-align:left;-webkit-backdrop-filter:none;backdrop-filter:none}
.tools .menu button:hover,.tools .menu button:focus-visible{background:var(--chip-line);outline:none}
.tools .menu button:active{transform:none;background:var(--chip-line)}
.menu .tag{margin-left:auto;font:500 12px var(--ui);opacity:.6}
.menu hr{border:0;height:6px;margin:0}
/* model settings sheet */
#ai{position:absolute;inset:0;z-index:9;display:grid;place-items:end center;background:rgba(36,28,22,.38);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:aiFade .2s ease}
@keyframes aiFade{from{opacity:0}}
#ai .sheet{width:100%;max-width:520px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;box-sizing:border-box;
  background:var(--sheet);color:var(--chip-ink);border-radius:26px 26px 0 0;
  padding-top:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px;animation:aiUp .32s cubic-bezier(.2,.85,.25,1);font-family:var(--sans-ui)}
@media (min-width:600px){#ai{place-items:center}#ai .sheet{border-radius:26px}}
@keyframes aiUp{from{transform:translateY(40px);opacity:.4}}
#ai header{display:flex;align-items:center;gap:12px}
#ai h2{margin:0;flex:1;font:700 19px/1.2 var(--sans-ui)}
#ai h2 small{display:block;margin-top:4px;font:500 11px var(--ui);letter-spacing:.12em;opacity:.55}
#ai .x{width:36px;height:36px;border-radius:50%;border:0;background:var(--field);color:inherit;display:grid;place-items:center;cursor:pointer}
#ai .x svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#ai label{display:flex;flex-direction:column;gap:7px;font:600 13px var(--sans-ui)}
#ai label > span{display:flex;justify-content:space-between;gap:8px}
#ai label em{font:500 12px var(--ui);font-style:normal;opacity:.55}
#ai input,#ai select,#ai textarea{width:100%;box-sizing:border-box;border:0;border-radius:14px;background:var(--field);color:inherit;
  font:500 15px var(--sans-ui);padding:12px 14px;outline:none;-webkit-appearance:none;appearance:none}
#ai textarea{min-height:132px;resize:vertical;line-height:1.6}
#ai input:focus,#ai select:focus,#ai textarea:focus{box-shadow:0 0 0 2px var(--clay)}
#ai .row{display:flex;gap:8px}
#ai .row > *{min-width:0}
#ai .eye{flex:none;width:46px;border:0;border-radius:14px;background:var(--field);color:inherit;cursor:pointer;display:grid;place-items:center}
#ai .eye svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7}
#ai input[type=range]{padding:0;height:28px;background:transparent;accent-color:var(--clay);-webkit-appearance:auto;appearance:auto;box-shadow:none}
#ai .models{display:flex;gap:6px;flex-wrap:wrap}
#ai .models button{flex:1;min-width:120px;height:44px;border:0;border-radius:14px;background:var(--field);color:inherit;font:600 13px var(--ui);cursor:pointer}
#ai .models button[aria-pressed="true"]{background:var(--clay);color:#fff}
#ai .note{margin:0;font:500 12px/1.6 var(--sans-ui);opacity:.62}
#ai .msg{margin:0;min-height:20px;font:500 13px/1.5 var(--sans-ui)}
#ai .msg.ok{color:#3f8a52} #ai .msg.err{color:#b4462c}
/* save button: capsule -> spinning ball while connecting -> stretches back into a capsule with the result */
#ai .acts{display:flex;justify-content:center}
#ai .go{--ok:#3f8a52;--bad:#b4462c;position:relative;width:100%;height:50px;border:0;border-radius:25px;background:var(--clay);color:#fff;
  font:700 15px var(--sans-ui);cursor:pointer;overflow:hidden;
  transition:width .42s cubic-bezier(.65,0,.35,1),background .3s,transform .2s}
#ai .go .lbl{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:opacity .18s,transform .3s}
#ai .go .lbl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#ai .go .orb{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;transition:opacity .2s}
#ai .go .orb i{position:absolute;left:50%;top:0;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 0 rgba(255,255,255,.4)}
#ai .go[data-state="busy"]{width:50px;cursor:default}
#ai .go[data-state="busy"] .lbl{opacity:0;transform:scale(.6)}
#ai .go[data-state="busy"] .orb{opacity:1;animation:orbit .8s linear infinite}
#ai .go[data-state="busy"] .orb i{animation:orbPulse .8s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes orbPulse{50%{transform:scale(.7)}}
#ai .go[data-state="ok"]{background:var(--ok)}
#ai .go[data-state="err"]{background:var(--bad);animation:shake .42s .42s}
#ai .go[data-state="ok"] .lbl,#ai .go[data-state="err"] .lbl{animation:lblIn .36s .3s both}
@keyframes lblIn{from{opacity:0;transform:scale(.7)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
#ai .models .ph{flex:1;height:44px;border-radius:14px;background:var(--field);animation:ph 1s ease-in-out infinite alternate}
@keyframes ph{to{opacity:.45}}
#ai .models button{animation:chipIn .3s both}
@keyframes chipIn{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){#ai .go,#ai .go .lbl,#ai .go .orb{transition:none}#ai .go .orb,#ai .go .orb i,#ai .go[data-state="err"]{animation:none}}
#kbd{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0;resize:none;z-index:-1}
@media (prefers-reduced-motion:reduce){#sun svg{animation:none}}
</style>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const stage=$('#stage'), pc=$('#paper'), fx=$('#fx'), svgB=$('#twB'), svgF=$('#twF'), sun=$('#sun');

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const POEM={
  zh:["早上来得很轻。水壶还在慢慢变凉，阳光刚好落在你书桌的一角。我把这几行字敲出来，好让你有点东西可以拿在手里。",

      "Now the window has gone blue. Leave the dishes. Stay a little longer; the typewriter and I will keep the lamp on for you."]
};
const PROMPT={zh:"（轮到你了。直接打字，我替你敲出来。）",en:"(your turn. type anything and I will strike it.)"};
const RHINT={zh:'双击退出',en:'DOUBLE-TAP TO CLOSE'};
const HINT={zh:"轻触开启声音 · 直接打字，或点键盘上的键",en:"tap for sound · type, or press the keys"};
const STAT={ready:'READY',typing:'TYPING',ret:'RETURN',load:'LOADING SHEET',think:'THINKING'};
let lang=(navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en';
try{const l=localStorage.getItem('pm80-lang'); if(l==='zh'||l==='en') lang=l;}catch(e){}

let W=0,H=0,dpr=1,PW,s,pL,pT,paperW,paperL0,textL0,textR0,strikeX,yPL,yClip;
let M, emblemD, textStartOff, sheetH, BH, keepAbove;
const vx=x=>pL+x*s, vy=y=>pT+y*s;

function applyPT(){
  for(const el of [svgB,svgF]) el.style.top=pT+'px';
  yPL=vy(136); yClip=vy(178);
}

  const vv=window.visualViewport, h=vv?vv.height:innerHeight, top=vv?vv.offsetTop:0;

  for(const el of [svgB,svgF]) Object.assign(el.style,{left:pL+'px',width:PW+'px',height:PH+'px'});
  applyPT();

  buildLamp();
}
const TYPE='"Special Elite","Courier Prime","American Typewriter","Courier New",monospace';
const SERIF='"Noto Serif SC","Songti SC","STSong","SimSun",serif';
const gc=document.createElement('canvas'), gx=gc.getContext('2d');
function metrics(){
  const tw=textR0-textL0;
  if(lang==='en'){
    gx.font='100px '+TYPE; const ratio=(gx.measureText('M').width||60)/100;
    const fs=clamp(tw/(27*ratio),11,15.5); const adv=fs*ratio;
    return {fs,adv,cell:adv,font:`${fs}px ${TYPE}`,asc:fs*.74,lineH:Math.round(fs*1.45),cap:tw};
  }
  const fs=clamp(tw/15.5,11,14.5);
  return {fs,adv:fs*1.06,half:fs*.56,cell:fs*1.06,font:`700 ${fs}px ${SERIF}`,asc:fs*.84,lineH:Math.round(fs*1.8),cap:tw};

let gcache=new Map();
function isWide(ch){const c=ch.codePointAt(0);
  if(lang==='zh'&&(c===0x2014||c===0x2026||(c>=0x2018&&c<=0x201D)))return true;
  return (c>=0x1100&&c<=0x115F)||(c>=0x2E80&&c<=0xA4CF)||(c>=0xAC00&&c<=0xD7A3)||(c>=0xF900&&c<=0xFAFF)||(c>=0xFE30&&c<=0xFE4F)||(c>=0xFF00&&c<=0xFF60)||(c>=0xFFE0&&c<=0xFFE6)||c>=0x1F300;}

  const key=lang+ch; if(gcache.has(key)) return gcache.get(key);
  const wide=isWide(ch);
  const adv=lang==='en'?(wide?M.fs*1.05:M.adv):(wide?M.adv:M.half);
  const g={adv,wide,ink:!/\s/.test(ch)}; gcache.set(key,g); return g;
}
const widthOf=str=>[...str].reduce((a,ch)=>a+glyph(ch).adv,0);

const sheet=document.createElement('canvas'), sctx=sheet.getContext('2d');
let bufOffset=0, SS=2;
let ribbonPhase=Math.random()*10;
function ribbon(x){return clamp(.88+.08*Math.sin(x*.021+ribbonPhase)+.05*Math.sin(x*.0041+ribbonPhase*2.3),.65,1);}
function makeSheetBuffer(){
  keepAbove=H+320; BH=Math.ceil(Math.max(H,900)*2+900);
  SS=Math.min(3,Math.max(2,dpr*1.5));
  sheet.width=Math.ceil(paperW*SS); sheet.height=Math.ceil(BH*SS);
  sctx.setTransform(1,0,0,1,0,0); sctx.clearRect(0,0,sheet.width,sheet.height);
}
function ensureBuffer(){
  if(F-bufOffset>BH-300){
    const newOff=F-keepAbove, delta=newOff-bufOffset;
    const tmp=document.createElement('canvas'); tmp.width=sheet.width; tmp.height=sheet.height; tmp.getContext('2d').drawImage(sheet,0,0);
    sctx.setTransform(1,0,0,1,0,0); sctx.clearRect(0,0,sheet.width,sheet.height); sctx.drawImage(tmp,0,-delta*SS);
    bufOffset=newOff;
  }
}
/* lead-type strike: each glyph is rendered at 4x, eroded with a binary grunge mask, then pressed onto the sheet */
const GS=4;
const gcv=document.createElement('canvas'), gctx=gcv.getContext('2d');
const grunge=document.createElement('canvas');
(function(){
  grunge.width=720; grunge.height=360; const g=grunge.getContext('2d'), R=Math.random;
  g.fillStyle='#000';
  const blot=(x,y,r)=>{g.beginPath(); g.ellipse(x,y,r*(.6+R()*.8),r*(.5+R()*.6),R()*3.14,0,Math.PI*2); g.fill();};
  for(let i=0;i<1500;i++) blot(R()*720,R()*360,.75+R()*.95);           // fine dust
  for(let i=0;i<170;i++){ const cx=R()*720, cy=R()*360, n=5+R()*16|0;   // worn clusters
    for(let k=0;k<n;k++){ const a=R()*6.28, d=R()*9; blot(cx+Math.cos(a)*d,cy+Math.sin(a)*d,.9+R()*2); } }

  for(let i=0;i<34;i++){ g.lineWidth=.9+R()*.8; const x=R()*720,y=R()*360,a=R()*6.28,l=5+R()*16;  // hairline scratches
    g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+Math.cos(a+.4)*l*.5,y+Math.sin(a+.4)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke(); }
})();
function sized(font,mul){ return font.replace(/([\d.]+)px/,(m,n)=>(parseFloat(n)*mul).toFixed(2)+'px'); }
/* every strike is logged with its random draws so the reader can re-press it at any resolution */
let strikes=[];
function makeStrike(ch,g,x,base,red){
  const R=Math.random;
  const font=(g.wide&&lang==='en')?`700 ${M.fs*.95}px ${SERIF}`:(lang==='zh'&&!g.wide?`${M.fs*1.02}px ${TYPE}`:M.font);
  const heavy=/[.,;:!?。，、！？]/.test(ch)?1.06:1;
  return {ch,adv:g.adv,font,fs:M.fs,red:!!red,zh:lang==='zh',
    x:x+g.adv/2+(R()-.5)*.25, base:base+(R()-.5)*.45,
    rot:(R()-.5)*.028, ox:(R()-.5)*.9/GS, oy:(R()-.5)*.6/GS,
    gu:R(), gv:R(), ga:[R(),R()], p1:.68+R()*.32, p2:.68+R()*.32,
    alpha:clamp(ribbon(x)*(.86+R()*.14)*heavy,.55,1)};
}
function pressGlyph(ctx,e,gs){
  const k=gs/GS;                                         // grunge was drawn at GS px per css px
  const w=Math.ceil((e.adv+e.fs*.7)*gs), h=Math.ceil(e.fs*1.7*gs);
  if(gcv.width<w||gcv.height<h){ gcv.width=Math.max(gcv.width,w); gcv.height=Math.max(gcv.height,h); }
  const c=gctx; c.setTransform(1,0,0,1,0,0); c.globalCompositeOperation='source-over'; c.globalAlpha=1; c.clearRect(0,0,w+2,h+2);
  const bx=w/2, by=Math.round(h*.74);
  c.font=sized(e.font,gs); c.textAlign='center'; c.textBaseline='alphabetic';
  c.fillStyle=e.red?'rgb(150,30,34)':'rgb(27,23,26)';
  c.save(); c.translate(bx,by); c.rotate(e.rot);
  c.fillText(e.ch,0,0);
  c.globalAlpha=.5; c.fillText(e.ch,e.ox*gs,e.oy*gs);
  c.restore(); c.globalAlpha=1;
  c.globalCompositeOperation='destination-out';
  c.globalAlpha=e.zh?1:.75;
  const gw=grunge.width*k, gh=grunge.height*k;
  c.drawImage(grunge,-e.gu*Math.max(0,gw-w),-e.gv*Math.max(0,gh-h),gw,gh);
  c.globalAlpha=1;
  c.globalCompositeOperation='destination-in';
  const gr=c.createLinearGradient(e.ga[0]*w,0,e.ga[1]*w,h); gr.addColorStop(0,`rgba(0,0,0,${e.p1})`); gr.addColorStop(1,`rgba(0,0,0,${e.p2})`);
  c.fillStyle=gr; c.fillRect(0,0,w,h);
  c.globalCompositeOperation='source-over';
  ctx.imageSmoothingQuality='high';
  ctx.globalAlpha=e.alpha;
  ctx.drawImage(gcv,0,0,w,h,e.x-w/gs/2,e.base-by/gs,w/gs,h/gs);
  ctx.globalAlpha=1;
}
function strike(ch,g,x,base,red){
  const e=makeStrike(ch,g,x,base,red); strikes.push(e);
  sctx.setTransform(SS,0,0,SS,0,-bufOffset*SS);
  pressGlyph(sctx,e,GS);
  if(readerOpen) readerStrike(e);
}

function buildEmblem(){
  const D=emblemD, pad=6, c=document.createElement('canvas'); c.width=Math.ceil((D+pad*2)*dpr); c.height=c.width;
  const g=c.getContext('2d'); g.scale(dpr,dpr); g.translate(D/2+pad,D/2+pad);
  const R=D/2;
  const shape=()=>{
    g.lineWidth=Math.max(1,D*.012);
    g.beginPath(); const N=30;
    for(let i=0;i<=N*8;i++){const a=i/(N*8)*Math.PI*2; const rr=R*(.955+.045*Math.cos(a*N)); i?g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):g.moveTo(rr,0);}
    g.closePath(); g.stroke();
    g.beginPath(); g.arc(0,0,R*.74,0,Math.PI*2); g.stroke();
    g.beginPath(); g.arc(-R*.12,-R*.16,R*.3,0,Math.PI*2); g.arc(R*.0,-R*.24,R*.25,0,Math.PI*2,true); g.fill('evenodd');
    g.beginPath(); g.moveTo(R*.02,R*.56); g.bezierCurveTo(R*.08,R*.3,R*.2,R*.12,R*.34,-R*.02); g.stroke();
    const leaf=(x,y,a,l)=>{g.save(); g.translate(x,y); g.rotate(a); g.beginPath(); g.ellipse(l/2,0,l/2,l*.2,0,0,Math.PI*2); g.fill(); g.restore();};
    leaf(R*.06,R*.4,-2.5,R*.22); leaf(R*.07,R*.38,-.5,R*.2); leaf(R*.16,R*.2,-2.6,R*.2); leaf(R*.18,R*.17,-.7,R*.18); leaf(R*.29,R*.04,-1.9,R*.16);
    for(const [x,y,k] of [[R*.36,-R*.36,1],[R*.48,-R*.12,.7],[-R*.42,R*.3,.8]]){g.beginPath();g.arc(x,y,R*.035*k,0,Math.PI*2);g.fill();}
    const txt='PAPERMOON  ·  NO. 5  ·  WRITTEN BY HAND  ·  ';
    g.font=`600 ${R*.13}px "Barlow Condensed","Arial Narrow",sans-serif`; g.textAlign='center'; g.textBaseline='middle';
    const chars=[...txt]; chars.forEach((ch,i)=>{const a=i/chars.length*Math.PI*2-Math.PI/2; g.save(); g.rotate(a+Math.PI/2); g.fillText(ch,0,-R*.855); g.restore();});
  };
  const pass=(dx,dy,col)=>{g.save(); g.translate(dx,dy); g.fillStyle=g.strokeStyle=col; shape(); g.restore();};
  pass(.9,1.1,'rgba(118,96,62,.42)'); pass(-.8,-.9,'rgba(255,255,255,.9)'); pass(0,0,'rgba(238,230,214,.92)');
  emblem=c;
}

function wrap(text){
  const units=[];
  if(lang==='en'){ text.split(/(\s+)/).forEach(t=>{if(t) units.push(t);}); }
  else{ const closers='，。、；：？！）」』”’》…—,.;:?!)'; for(const ch of text){ if(units.length&&closers.includes(ch)) units[units.length-1]+=ch; else units.push(ch); } }
  const lines=[]; let cur='', w=0;
  for(const u of units){
    const uw=widthOf(u), isSpace=/^\s+$/.test(u);
    if(isSpace){ if(cur){cur+=' '; w+=glyph(' ').adv;} continue; }
    if(w+uw>M.cap+.5 && cur){ lines.push(cur.trimEnd()); cur=''; w=0; }
    cur+=u; w+=uw;
  }
  if(cur.trim()) lines.push(cur.trimEnd());
  return lines;
}
function rhythm(ch){
  if('。.!?！？'.includes(ch)) return 460+Math.random()*160;
  if('，,；;：:'.includes(ch)) return 230+Math.random()*90;
  if(ch==='—'||ch==='…') return 150;
  if(ch===' ') return 30+Math.random()*40;
  return (lang==='zh'?60:22)+Math.random()*(lang==='zh'?80:60);
}
function pushText(q,text,fast){
  for(const line of wrap(text)){
    for(const ch of line){ q.push({t:'char',ch}); q.push({t:'gap',ms:fast?14+Math.random()*20:rhythm(ch)}); }
    q.push({t:'nl'}); q.push({t:'gap',ms:200});
  }
}
function signature(){
  const d=new Date(), hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
  return lang==='zh'?`—— ${d.getMonth()+1}月${d.getDate()}日 ${hh}:${mm}`:`— ${hh}:${mm}, No. 5`;
}
function poemQueue(){

    if(i===1){ q.push({t:'ev',fn:()=>setNight(1,6500)}); q.push({t:'gap',ms:1800}); }
    pushText(q,para,false);
    q.push({t:'lf',n:1}); q.push({t:'gap',ms:900});
  });
  const sig=signature();
  q.push({t:'tab',x:Math.max(0,M.cap-widthOf(sig))});
  for(const ch of sig){q.push({t:'char',ch,red:true}); q.push({t:'gap',ms:40+Math.random()*40});}
  q.push({t:'nl'}); q.push({t:'lf',n:1}); q.push({t:'gap',ms:2600});
  pushText(q,PROMPT[lang],true);
  q.push({t:'ev',fn:()=>{mode='await';}});

}

function startAct(a,now){
  a.t0=now;
  switch(a.t){
    case 'char':{
      if(!hasSheet){ queue.unshift({t:'char',ch:a.ch}); a.t='feedIn'; return startAct(a,now); }
      const g=glyph(a.ch);
      if(cursor+g.adv>M.cap+.5){ queue.unshift({t:'char',ch:a.ch}); a.t='nl'; return startAct(a,now); }
      if(cursor===0&&a.ch===' '){a.dur=0;a.skip=true;return;}
      a.g=g; a.x0=headX; a.x1=headX+g.adv; a.struck=false; a.base=F;
      a.dur=g.ink?(lang==='zh'?92:78)+Math.random()*24:62;
      pressFor(a.ch);
      if(g.ink){ strikeT0=now; strikeUp=a.dur*.5; sKey(a.dur*.5/1000); }
      else sSpace();
      if(!bellRung && cursor+g.adv>M.cap-M.cell*7){ bellRung=true; setTimeout(sBell,a.dur*.5); }
      break;}
    case 'gap': a.dur=a.ms; break;
    case 'nl':{
      a.x0=headX; a.F0=F; a.F1=F+M.lineH;
      const frac=(headX-textL0)/(textR0-textL0);
      a.dur=320+frac*560;
      sReturn(a.dur/1000,frac);
      break;}
    case 'lf': a.F0=F; a.F1=F+M.lineH*a.n; a.dur=190*a.n; sTicks(2*a.n,.05,.07); break;
    case 'tab': a.x0=headX; a.x1=textL0+a.x; a.dur=180+Math.abs(a.x1-a.x0)*1.1; sZip(a.dur/1000); break;
    case 'eject': eject(); a.dur=0; break;
    case 'feedIn':{
      sheetTop=F+(yClip-yPL)+6; hasSheet=true;
      sctx.setTransform(1,0,0,1,0,0); sctx.clearRect(0,0,sheet.width,sheet.height);
      bufOffset=sheetTop-60; strikes=[];
      if(readerOpen){ renderReader(); rscroll.scrollTop=0; }
      a.F0=F; a.F1=sheetTop+textStartOff; a.x0=headX; a.dur=1300;
      sRoll(a.dur/1000); sZip(.5);
      break;}
    case 'ev': a.fn(); a.dur=0; break;
  }
}
function stepAct(a,k){
  switch(a.t){
    case 'char':
      if(a.skip) return;
      if(!a.struck && k>=.5) emit(a);
      headX=a.x0+(a.x1-a.x0)*(k<.5?0:eout((k-.5)/.5));
      break;
    case 'nl':
      F=lerp(a.F0,a.F1,eout(clamp(k/.3,0,1)));
      headX=lerp(a.x0,textL0,eio(clamp((k-.18)/.82,0,1)));
      leverA=Math.sin(clamp(k/.32,0,1)*Math.PI)*-16;
      break;
    case 'lf': F=lerp(a.F0,a.F1,eout(k)); break;
    case 'tab': headX=lerp(a.x0,a.x1,eio(k)); break;
    case 'feedIn': F=lerp(a.F0,a.F1,eio(k)); headX=lerp(a.x0,textL0,eio(clamp(k*1.6,0,1))); break;
  }
}
function endAct(a){
  switch(a.t){
    case 'char': if(a.skip)return; if(!a.struck) emit(a); cursor+=a.g.adv; headX=a.x1; break;
    case 'nl':
      cursor=0; F=a.F1; headX=textL0; leverA=0; bellRung=false; ribbonPhase+=.9; ensureBuffer(); jolt(1.2);
      if(F>sheetTop+sheetH-M.lineH*2.5) queue.unshift(...sheetSwap(false));
      break;
    case 'lf': F=a.F1; ensureBuffer(); break;
    case 'tab': cursor=a.x; headX=a.x1; break;
    case 'feedIn': F=a.F1; cursor=0; headX=textL0; bellRung=false; ensureBuffer(); break;
  }
}
function emit(a){
  a.struck=true; if(!a.g.ink) return;
  strike(a.ch,a.g,a.x0-paperL0,a.base,a.red);
  jolt(.45);
}
function engine(now){
  let guard=0;
  while(guard++<40){
    if(!act){ if(!queue.length) return; act=queue.shift(); startAct(act,now); }
    const k=act.dur>0?(now-act.t0)/act.dur:1;
    stepAct(act,clamp(k,0,1));
    if(k>=1){ endAct(act); act=null; continue; }
    return;
  }
}

function eject(){
  if(!hasSheet) return;
  const top=yPL+sheetTop-F, x0=paperL0+carX()-6, w=paperW+12;
  const y0=Math.max(0,top-4), h=yClip+2-y0;

    const c=document.createElement('canvas'); c.width=Math.ceil(w*dpr); c.height=Math.ceil(h*dpr);
    c.className='flyer'; Object.assign(c.style,{left:x0+'px',top:y0+'px',width:w+'px',height:h+'px'});
    c.getContext('2d').drawImage(pc,x0*dpr,y0*dpr,w*dpr,h*dpr,0,0,c.width,c.height);
    stage.insertBefore(c,sun);

      {transform:'translate(0,0) rotate(0deg)'},

    ],{duration:RM?400:1300,easing:'cubic-bezier(.5,0,.75,.3)',fill:'forwards'});

function enterUser(){

function feedText(str){
  if(!str) return; unlockAudio(); enterUser(); hintOff();
  if(convo.streaming){ convo.held.push(str); return; }   // the reply is still being struck; your words follow right after it
  if(convo.busy) convoAbort();                          // typing while it is still thinking means you have the floor again
  convo.buf+=str; convo.nls=0;
  if(document.fonts&&/[^\x00-\x7f]/.test(str)) document.fonts.load('700 15px "Noto Serif SC"',str).catch(()=>{});
  for(const ch of str){ if(ch==='\n'){queue.push({t:'nl'});continue;} queue.push({t:'char',ch}); queue.push({t:'gap',ms:10}); }
}

/* ---------------- conversation with the model ----------------
   You type; a blank line (Enter twice) hands the turn over. The reply is struck on the same sheet in the same ink,
   then another blank line hands it back. The current sheet is the context; a fresh sheet or a replay starts a new talk. */
const convo={turns:[],buf:'',nls:0,busy:false,streaming:false,ctl:null,held:[],warned:false};
function convoAbort(){ if(convo.ctl){ try{convo.ctl.abort();}catch(_){} } convo.ctl=null; convo.busy=false; convo.streaming=false; }
function convoReset(){ convoAbort(); convo.turns=[]; convo.buf=''; convo.nls=0; convo.held=[]; }
function flash(msg,ms){ const h=$('#hint'); h.textContent=msg; h.style.opacity=1; clearTimeout(flash.t);
  flash.t=setTimeout(()=>{ h.style.opacity=0; setTimeout(setHint,700); },ms||4000); }
function convoNewline(){
  convo.nls++;
  if(convo.nls>=2&&convo.buf.trim()) askModel();
  else if(convo.nls===1) convo.buf+='\n';
}
// plain typewriter text only: drop markdown marks and squeeze blank lines (a blank line means "your turn")
function plain(t){ return t.replace(/\r/g,'').replace(/```[a-z]*\n?/gi,'').replace(/[*_`#>]+/g,'').replace(/^\s*[-•]\s+/gm,'').replace(/\n{2,}/g,'\n'); }
function strikeReply(t){ for(const ch of t){ if(ch==='\n'){ queue.push({t:'nl'}); continue; } queue.push({t:'char',ch}); queue.push({t:'gap',ms:38}); } }
async function askModel(){
  const said=convo.buf.trim(); convo.buf=''; convo.nls=0;
  const cfg=aiLoad();
  if(!cfg.key){
    if(!convo.warned){ convo.warned=true; flash(lang==='zh'?'在右上角 ⋯ › 模型接入 填好 Key，空一行就会收到回复':'Add your key under ⋯ › AI model to get replies',6000); }
    return;
  }
  convo.turns.push({role:'user',content:said});
  convo.busy=true; convo.streaming=false; convo.held=[];
  const ctl=new AbortController(); convo.ctl=ctl;
  const mine=()=>convo.ctl===ctl;
  let full='', carry='', lastNL=true;
  const emit=piece=>{
    if(!mine()) return;
    let t=plain(carry+piece); carry='';
    if(t.endsWith('\n')){ carry='\n'; t=t.slice(0,-1); }          // hold a trailing newline until we know it is not a blank line
    if(lastNL) t=t.replace(/^\n+/,'');
    if(!t) return;
    if(!convo.streaming){ convo.streaming=true; }
    strikeReply(t); full+=t; lastNL=t.endsWith('\n');
  };
  try{
    const r=await xfetch(cfg.base+'/chat/completions',{method:'POST',signal:ctl.signal,
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
      body:JSON.stringify({model:cfg.model,temperature:cfg.temperature,stream:true,
        messages:[{role:'system',content:cfg.system},...convo.turns.slice(-24)]})});
    if(!r.ok){ const j=await r.json().catch(()=>({})); throw Object.assign(new Error('http'),{status:r.status,detail:j&&j.error&&j.error.message}); }
    if(r.body&&r.body.getReader){
      const rd=r.body.getReader(), dec=new TextDecoder(); let pend='';
      for(;;){
        const {value,done}=await rd.read(); if(done) break;
        pend+=dec.decode(value,{stream:true});
        const lines=pend.split('\n'); pend=lines.pop();
        for(const ln of lines){
          const m=ln.match(/^data:\s*(.*)$/); if(!m) continue;
          if(m[1]==='[DONE]') break;
          try{ const d=JSON.parse(m[1]).choices[0].delta; if(d&&d.content) emit(d.content); }catch(_){}
        }
      }
    }else{
      const j=await r.json(); emit(((j.choices||[])[0]||{}).message?.content||'');
    }
    if(!mine()) return;
    if(full.trim()){
      convo.turns.push({role:'assistant',content:full.trim()});
      queue.push({t:'nl'},{t:'nl'});                       // blank line: your turn again
    }else{ convo.turns.pop(); flash(lang==='zh'?'它没有说话，换个说法再试试':'No reply this time. Try again.'); }
  }catch(err){
    if(!mine()) return;
    convo.turns.pop(); convo.buf=said;                     // give the words back so two more Enters retry
    const st=err.status;
    flash(lang==='zh'
      ? (st===401?'Key 无效，请到 ⋯ › 模型接入 检查':st===402?'DeepSeek 余额不足':st===429?'请求太频繁，稍后再按两次回车重试':'没连上模型，再按两次回车重试')
      : (st===401?'Invalid key, check ⋯ › AI model':st===402?'DeepSeek balance is empty':'Could not reach the model. Press Enter twice to retry.'),6000);
  }finally{
    if(mine()){
      convo.busy=false; convo.streaming=false; convo.ctl=null;
      const held=convo.held; convo.held=[];
      for(const h of held){ if(h==='\n') userNL(); else feedText(h); }
    }
  }
}

/* ---------------- network for the model ----------------
   Inside the Android app, requests go through native code (window.NativeHttp) so the API's cross-origin rules
   don't matter; the result is a normal streaming Response. In a browser it is plain fetch. */
const xfetch=(()=>{
  const NH=window.NativeHttp; if(!NH||!NH.request) return (u,i)=>fetch(u,i);
  const top=(()=>{ try{ return window.top.document&&window.top; }catch(_){ return window; } })();
  const map=top.__nhMap||(top.__nhMap={});
  top.__nhSeq=top.__nhSeq||0;
  top.__nh=top.__nh||{
    head:(id,st)=>map[id]&&map[id].head(st), data:(id,b)=>map[id]&&map[id].data(b),
    end:id=>map[id]&&map[id].end(), fail:(id,m)=>map[id]&&map[id].fail(new TypeError(m))};
  return (url,init)=>new Promise((resolve,reject)=>{
    init=init||{}; const id=++top.__nhSeq; let ctl, settled=false;
    const stream=new ReadableStream({start(c){ ctl=c; }, cancel(){ NH.cancel(id); delete map[id]; }});
    const fail=e=>{ delete map[id]; if(!settled){ settled=true; reject(e); } try{ ctl.error(e); }catch(_){} };
    map[id]={
      head(st){ if(settled) return; settled=true; resolve(new Response(stream,{status:st})); },
      data(b){ const bin=atob(b), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); try{ ctl.enqueue(u); }catch(_){} },
      end(){ delete map[id]; try{ ctl.close(); }catch(_){} },
      fail
    };
    const sig=init.signal;
    if(sig){ if(sig.aborted) return fail(new DOMException('Aborted','AbortError'));
      sig.addEventListener('abort',()=>{ NH.cancel(id); fail(new DOMException('Aborted','AbortError')); }); }
    NH.request(id,init.method||'GET',url,JSON.stringify(init.headers||{}),typeof init.body==='string'?init.body:'');
  });
})();

    out={ok:false,e:err.name==='AbortError'?['没有响应','20 秒没有响应，请检查网络或接口地址。']:['连不上','连不上接口。网页预览不允许联网，请在安装包里试；已经在安装包里的话，请检查网络和接口地址。']};
  }
  const left=900-(performance.now()-t0); if(left>0) await wait(left);   // let the ball turn at least once
  if(out.ok){
    if(out.ids&&out.ids.length){
      if(!out.ids.includes(c.model)){ c.model=out.ids.includes('deepseek-chat')?'deepseek-chat':out.ids[0]; aiF.model.value=c.model; }
      renderModels(out.ids);
    }
    save({ok:true,models:out.ids||aiLoad().models||null,checked:Date.now()});
    setBtn('ok','连接成功');
    say(out.ids?'已取回 '+out.ids.length+' 个可用模型，当前使用 '+c.model+'。':'连接正常。这个接口不提供模型列表，继续使用 '+c.model+'。','ok');
  }else{
    setBtn('err',out.e[0]); say(out.e[1],'err');
    setTimeout(()=>{ if(aiBtn.dataset.state==='err') setBtn('idle'); },2600);
  }
  aiTag();
});
aiTag();

/* ---------------- full-page reader ---------------- */
const reader=$('#reader'), rpage=$('#rpage'), rscroll=reader.querySelector('.rscroll');
let readerOpen=false, rState=null, rTouch=false, rTouchEnd=-1e9;
function renderReader(){
  const avail=Math.min(W-32,680), k=avail/paperW, rd=Math.min(3,window.devicePixelRatio||1);
  const top=sheetTop, bottom=sheetTop+sheetH;
  const cssW=Math.round(paperW*k), cssH=Math.round((bottom-top)*k);
  rpage.width=Math.round(cssW*rd); rpage.height=Math.round(cssH*rd);
  rpage.style.width=cssW+'px'; rpage.style.height=cssH+'px';
  const c=rpage.getContext('2d');
  c.setTransform(rd,0,0,rd,0,0);
  c.fillStyle='#f4eee2'; c.fillRect(0,0,cssW,cssH);
  const pat=c.createPattern(tex,'repeat'); pat.setTransform(new DOMMatrix([k,0,0,k,0,0])); c.fillStyle=pat; c.fillRect(0,0,cssW,cssH);
  let g=c.createLinearGradient(0,0,cssW,0);
  g.addColorStop(0,'rgba(90,70,40,.08)'); g.addColorStop(.03,'rgba(90,70,40,0)'); g.addColorStop(.97,'rgba(90,70,40,0)'); g.addColorStop(1,'rgba(90,70,40,.08)');
  c.fillStyle=g; c.fillRect(0,0,cssW,cssH);
  c.setTransform(rd*k,0,0,rd*k,0,-top*rd*k);
  const gs=Math.min(14,Math.max(GS,Math.ceil(k*rd*1.25)));
  for(const e of strikes) pressGlyph(c,e,gs);
  rState={c,gs,k,rd,top};
  return {k,cssH};
}
function openReader(){
  if(readerOpen||!hasSheet) return;
  readerOpen=true; reader.hidden=false; $('#rhint').textContent=RHINT[lang];
  const {k}=renderReader();
  // start with the most recent lines in view
  const lastY=(F-sheetTop)*k;
  rscroll.scrollTop=Math.max(0,lastY-rscroll.clientHeight*.6);
  requestAnimationFrame(()=>reader.classList.add('on'));
  sPull();
}
// press one new character onto the open page, and keep the line being typed in view unless the reader is being scrolled by hand
function readerStrike(e){
  if(!rState) return;
  const {c,gs,k,rd,top}=rState;
  c.setTransform(rd*k,0,0,rd*k,0,-top*rd*k);
  pressGlyph(c,e,gs);
  if(rTouch||performance.now()-rTouchEnd<1500) return;   // the reader was just scrolled by hand; leave it where it is
  const y=(e.base-top)*k, h=rscroll.clientHeight;
  if(y>rscroll.scrollTop+h-56||y<rscroll.scrollTop+24) rscroll.scrollTo({top:Math.max(0,y-h*.6),behavior:RM?'auto':'smooth'});
}
function closeReader(){
  if(!readerOpen) return;
  readerOpen=false; reader.classList.remove('on');
  setTimeout(()=>{ if(!readerOpen) reader.hidden=true; },330);
}
function onPaper(x,y){
  if(!hasSheet) return false;
  const pl=paperL0+carX(), top=Math.max(0,yPL+sheetTop-F);
  return x>=pl&&x<=pl+paperW&&y>=top&&y<=yClip;
}
let lastTap={t:0,x:0,y:0};
function tapCheck(e,inReader){
  const now=performance.now(), r=stage.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  const dbl=now-lastTap.t<320&&Math.hypot(x-lastTap.x,y-lastTap.y)<40;
  lastTap=dbl?{t:0,x:0,y:0}:{t:now,x,y};
  if(!dbl) return;
  if(inReader) closeReader(); else if(onPaper(x,y)) openReader();
}
stage.addEventListener('pointerup',e=>{ if(readerOpen||ch_.drag) return; if(e.target.closest('button,.k,#space,#lever')) return; tapCheck(e,false); });
reader.addEventListener('pointerup',e=>{ e.stopPropagation(); rTouch=false; rTouchEnd=performance.now(); tapCheck(e,true);
  if(kbdHeld&&document.activeElement!==kbd) kbd.focus({preventScroll:true}); });
let kbdHeld=false;
reader.addEventListener('pointerdown',e=>{ e.stopPropagation(); rTouch=true; kbdHeld=document.activeElement===kbd; });
reader.addEventListener('mousedown',e=>e.preventDefault());   // a tap on the page must not take focus away from the typing field
// same for the double-tap on the paper that opens the reader: the keyboard stays up and typing carries on
stage.addEventListener('mousedown',e=>{ if(document.activeElement===kbd&&!e.target.closest('button,.k,#space,#lever,#reader,#ai,.menu')) e.preventDefault(); });
reader.addEventListener('pointercancel',()=>{ rTouch=false; rTouchEnd=performance.now(); });
reader.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('keydown',e=>{ if(readerOpen&&e.key==='Escape'){ e.preventDefault(); closeReader(); } },true);

$('#bLangTag').textContent=lang==='zh'?'中':'EN'; menuLabels(); setHint();
buildKeys(); wireKeys();
let lastW=0,lastH=0;
function onViewport(){
  applyViewport();
  const r=stage.getBoundingClientRect();
  if(Math.abs(r.width-lastW)>2){ resetAll(false); lastW=W; lastH=H; }
  else { layout(); lastH=H; }
}
if(window.visualViewport){ visualViewport.addEventListener('resize',onViewport); visualViewport.addEventListener('scroll',applyViewport); }
kbd.addEventListener('focus',()=>{ setTimeout(onViewport,60); setTimeout(onViewport,400); });
kbd.addEventListener('blur',()=>{ setTimeout(onViewport,60); setTimeout(onViewport,400); });
window.addEventListener('resize',()=>{
  applyViewport();
  const r=stage.getBoundingClientRect();
  if(Math.abs(r.width-lastW)>2){ resetAll(false); lastW=W; lastH=H; }
  else if(Math.abs(r.height-lastH)>2){ layout(); lastH=H; }
});
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(window.__paused){ engine(now); updateNight(now); requestAnimationFrame(frame); return; }
  if(Math.abs(pT-pTt)>.1){ pT=lerp(pT,pTt,1-Math.pow(.0008,dt)); if(Math.abs(pT-pTt)<.1) pT=pTt; applyPT(); }
  engine(now); updateNight(now); physics(dt);
  drawPaper(); updateMachine(now); drawFX(now); updateStatus();
  requestAnimationFrame(frame);
}
const need=POEM.zh.join('')+PROMPT.zh+'——月日0123456789:';
function loadFonts(){
  if(!document.fonts||!document.fonts.load) return Promise.resolve();
  return Promise.all([document.fonts.load('15px "Special Elite"','The quick brown fox 0123456789.,;:()'),document.fonts.load('700 15px "Noto Serif SC"',need)]).catch(()=>{});
}
applyViewport();
Promise.race([loadFonts(),new Promise(r=>setTimeout(r,2500))]).then(()=>{ resetAll(true); lastW=W; lastH=H; requestAnimationFrame(t=>{last=t; frame(t);}); });
})();
